services:
  bot1:
    build: .
    container_name: aibot_prod_1
    restart: unless-stopped
    ports:
      # Loopback-only: nginx reaches this over the docker network (upstream bot1:3000).
      # Public internet must never hit the backend directly (bypasses nginx/TLS/rate-limit).
      - "127.0.0.1:3001:3000"
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - INSTANCE_ID=bot1
      - BOT_MODE=polling
      - DISABLE_WORKERS=true
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - aibot_network

  # Bot Instance 2 (webhook mode only - uncomment when domain + SSL ready)
  # bot2:
  #   build: .
  #   container_name: aibot_prod_2
  #   restart: unless-stopped
  #   ports:
  #     - "3002:3000"
  #   env_file:
  #     - .env.production
  #   environment:
  #     - NODE_ENV=production
  #     - INSTANCE_ID=bot2
  #     - BOT_MODE=webhook
  #     - WEBHOOK_DOMAIN=${WEBHOOK_DOMAIN}
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     redis:
  #       condition: service_started
  #   healthcheck:
  #     test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/health"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3
  #     start_period: 40s
  #   networks:
  #     - aibot_network

  # ============================================
  # DEV/STAGING BOT (uses test bot token)
  # ============================================
  dev-bot:
    build: .
    container_name: aibot_dev
    restart: unless-stopped
    ports:
      # Loopback-only: nginx reaches this over the docker network (upstream dev-bot:3000).
      # Extra-important here because this container mounts docker.sock (see SECURITY.md §2)
      # — it must never be directly reachable from the internet.
      - "127.0.0.1:3003:3000"
    env_file:
      - .env.staging
    environment:
      - NODE_ENV=staging
      - INSTANCE_ID=dev
      - BOT_MODE=polling
      - DISABLE_WORKERS=true
      # Container-logs reads go through the locked-down read-only socket proxy,
      # NOT the raw docker.sock (which would be host-root, see SECURITY.md §2).
      - DOCKER_LOGS_HOST=docker-socket-proxy
      - DOCKER_LOGS_PORT=2375
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      docker-socket-proxy:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - aibot_network

  # Locked-down Docker API proxy (read-only) — replaces mounting docker.sock into
  # the internet-facing bot. Only this tiny container holds the socket; the bot can
  # only reach a filtered, GET-only API (container logs). See SECURITY.md §2.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    container_name: aibot_docker_proxy
    restart: unless-stopped
    environment:
      - CONTAINERS=1   # allow GET /containers/<name>/logs
      - POST=0         # read-only: block all mutating calls (default, explicit)
      - EXEC=0
      - IMAGES=0
      - NETWORKS=0
      - VOLUMES=0
      - INFO=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - aibot_network

  # Dedicated Worker (no bot, just queue processing)
  worker:
    build: .
    container_name: aibot_worker
    restart: unless-stopped
    command: ["node", "dist/worker.js"]
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - INSTANCE_ID=worker1
      - TEXT_WORKERS=5
      - IMAGE_WORKERS=10
      - VIDEO_WORKERS=2
      - AUDIO_WORKERS=8
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      disable: true
    networks:
      - aibot_network

  nginx:
    image: nginx:alpine
    container_name: aibot_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/:/etc/nginx/:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
      - ./webapp-dist:/var/www/webapp:ro
      - ./webapp-dev-dist:/var/www/webapp-dev:ro
      - ./admin/dist:/var/www/admin:ro
      - ./uploads:/var/www/uploads:ro
    depends_on:
      - bot1
      - dev-bot
      - pgadmin
    networks:
      - aibot_network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: aibot_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@vseonix.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "True"
      PGADMIN_CONFIG_LOGIN_BANNER: "'AI Models Bot - Production Database'"
      PGADMIN_CONFIG_CONSOLE_LOG_LEVEL: "30"
      PGADMIN_CONFIG_PROXY_X_FOR_COUNT: "1"
      PGADMIN_CONFIG_PROXY_X_PROTO_COUNT: "1"
      PGADMIN_CONFIG_PROXY_X_HOST_COUNT: "1"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - aibot_network

  postgres:
    image: postgres:15-alpine
    container_name: aibot_postgres_prod
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: aibot_production
      POSTGRES_USER: aibot
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    command:
      - "postgres"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "shared_buffers=512MB"
      - "-c"
      - "effective_cache_size=1GB"
      - "-c"
      - "work_mem=16MB"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aibot"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aibot_network

  redis:
    image: redis:7-alpine
    container_name: aibot_redis_prod
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory 4gb
      --maxmemory-policy allkeys-lru
      --save 60 1000
    volumes:
      - redis_prod_data:/data
    networks:
      - aibot_network

volumes:
  postgres_prod_data:
  redis_prod_data:
  pgadmin_data:

networks:
  aibot_network:
    driver: bridge
